# E17-52 (D117): this crate's tree contains Tokio's `process` feature (the
# MongoDB driver turns it on). Its sanctioned `std::process` files
# (ADR-0028, ADR-0031) and its tests stay under the lexical check; Tokio's
# process API is disallowed here by path, after name resolution. CI runs
# Clippy with -D warnings, and scripts/check-crate-capabilities.ts checks
# that these entries stay and that nothing lowers the lints.
disallowed-types = [
  { path = "tokio::process::Command", reason = "no Tokio process spawning in this crate (D117)" },
  { path = "tokio::process::Child", reason = "no Tokio process spawning in this crate (D117)" },
]
disallowed-methods = [
  { path = "tokio::process::Command::new", reason = "no Tokio process spawning in this crate (D117)" },
]
