[graph]
all-features = true

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "LicenseRef-Proprietary",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93
# E17-52 (D117, owner decision 2026-11-23): the two licences the MongoDB
# driver brings, allowed for exactly the one crate that carries each. The
# bundled root certificates the driver's TLS uses are CDLA-Permissive-2.0;
# a hash crate used only at build time by the driver's macro dependencies
# (const-random-macro) is CC0-1.0.
exceptions = [
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
  { crate = "tiny-keccak", allow = ["CC0-1.0"] },
]
include-dev = true
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
