name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint CI workflow
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: .github/workflows/ci.yml .github/workflows/package-beta.yml .github/workflows/release.yml
      - name: Assert required runner matrix
        run: ruby scripts/ci/check_ci_matrix.rb
      - name: Test deterministic release packaging
        run: scripts/package-tarball.sh --self-test
      - name: Test private beta release contracts
        run: python3 scripts/release/beta/tests/test_beta_release.py
      - name: Test local installer
        run: installers/tests/install_local_test.sh

  security:
    name: Security gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm
        run: corepack enable
      - name: Install locked TypeScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run TypeScript workspace checks
        run: pnpm check
      - name: Audit TypeScript dependencies
        run: pnpm audit --audit-level moderate
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          # Remove after https://github.com/Swatinem/rust-cache/issues/331 is fixed.
          NODE_OPTIONS: --disable-warning=DEP0040
      - name: Test crate capability boundaries
        run: node --experimental-strip-types --test scripts/check-crate-capabilities.test.ts
      - name: Enforce crate capability boundaries
        run: node --experimental-strip-types scripts/check-crate-capabilities.ts
      - name: Test documentation drift linter
        run: node --experimental-strip-types --test scripts/doc-drift-lint.test.ts
      - name: Enforce documentation drift lint
        shell: bash
        # Build outside the checkout: the secret scan below reads the whole
        # working tree, and dependency metadata (sqlx's .rmeta embeds a PEM
        # private key from its documentation examples) would be reported.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/doc-drift-target
        run: |
          cargo run -p compresso-cli --example surface_inventory > "${RUNNER_TEMP}/surface-inventory.json"
          node --experimental-strip-types scripts/doc-drift-lint.ts --inventory "${RUNNER_TEMP}/surface-inventory.json" --json
          rm -rf "${CARGO_TARGET_DIR}"
      - name: Install Rust security tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.19.4
      - name: Audit Rust advisories
        run: cargo audit
      - name: Check Rust licenses, bans, and sources
        run: cargo deny check licenses bans sources
      - name: Verify secret-scanner canary
        shell: bash
        run: |
          canary_dir="$(mktemp -d)"
          printf '%s%s\n' 'COMPRESSO_SECRET_CANARY_' '0123456789ABCDEF' > "${canary_dir}/canary.txt"
          set +e
          docker run --rm \
            --workdir /scan \
            --volume "${canary_dir}:/scan:ro" \
            --volume "${PWD}/.gitleaks.toml:/gitleaks.toml:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir . --config /gitleaks.toml --no-banner
          scan_status=$?
          set -e
          unlink "${canary_dir}/canary.txt"
          rmdir "${canary_dir}"
          case "${scan_status}" in
            0)
              echo "gitleaks failed to detect the secret canary" >&2
              exit 1
              ;;
            1)
              echo "gitleaks detected the secret canary"
              ;;
            *)
              echo "gitleaks canary scan failed with status ${scan_status}" >&2
              exit "${scan_status}"
              ;;
          esac
      - name: Verify benchmark allowlist scope
        shell: bash
        run: |
          probe_dir="$(mktemp -d)"
          probe_leaf="${probe_dir}/fixtures/benchmarks/json-2000-elements"
          probe_file="${probe_leaf}/input.json"
          mkdir -p "${probe_leaf}"
          printf '{"key": "%s%s"}\n' 'fixture-' '0123' > "${probe_file}"
          docker run --rm \
            --workdir /scan \
            --volume "${probe_dir}:/scan:ro" \
            --volume "${PWD}/.gitleaks.toml:/gitleaks.toml:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir . --config /gitleaks.toml --no-banner
          printf '{"key": "%s%s"}\n' 'Compresso7xK9Q2mV5p' 'R8sT4zY6' > "${probe_file}"
          set +e
          docker run --rm \
            --workdir /scan \
            --volume "${probe_dir}:/scan:ro" \
            --volume "${PWD}/.gitleaks.toml:/gitleaks.toml:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir . --config /gitleaks.toml --no-banner
          scan_status=$?
          set -e
          unlink "${probe_file}"
          rmdir "${probe_leaf}"
          rmdir "${probe_dir}/fixtures/benchmarks"
          rmdir "${probe_dir}/fixtures"
          rmdir "${probe_dir}"
          case "${scan_status}" in
            0)
              echo "gitleaks benchmark allowlist suppressed a non-fixture key" >&2
              exit 1
              ;;
            1)
              echo "gitleaks benchmark allowlist is value- and path-scoped"
              ;;
            *)
              echo "gitleaks allowlist probe failed with status ${scan_status}" >&2
              exit "${scan_status}"
              ;;
          esac
      - name: Scan repository for secrets
        shell: bash
        run: |
          docker run --rm \
            --workdir /repo \
            --volume "${PWD}:/repo:ro" \
            --volume "${PWD}/.gitleaks.toml:/gitleaks.toml:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir . --config /gitleaks.toml --no-banner

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
          - ubuntu-24.04
          - windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          # Remove after https://github.com/Swatinem/rust-cache/issues/331 is fixed.
          NODE_OPTIONS: --disable-warning=DEP0040
        with:
          shared-key: ci-${{ matrix.os }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast
      - name: Build release CLI
        run: cargo build --release --locked -p compresso-cli
      - name: Upload release binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compresso-${{ matrix.os }}
          path: |
            target/release/compresso
            target/release/compresso.exe
          if-no-files-found: error

  live-sql:
    # E17-50: the compresso_sql tests that need a real server, against
    # throwaway containers. The other jobs stay server-free.
    name: Live SQL (Postgres, MariaDB, MySQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: probe
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11.4.3
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: compresso_probe
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: compresso_probe
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          # Remove after https://github.com/Swatinem/rust-cache/issues/331 is fixed.
          NODE_OPTIONS: --disable-warning=DEP0040
        with:
          shared-key: ci-ubuntu-24.04
      - name: Start a TLS Postgres with a throwaway certificate
        # The certificate and keys are made here, live only in RUNNER_TEMP,
        # and name db.invalid and localhost, so a client verifying 127.0.0.1
        # must refuse and one verifying localhost must succeed (E17-52: the
        # MongoDB driver links rustls too).
        shell: bash
        run: |
          dir="${RUNNER_TEMP}/pgtls"
          mkdir -p "${dir}"
          cd "${dir}"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=compresso-test-ca -keyout ca.key -out ca.pem
          openssl req -newkey rsa:2048 -nodes -subj /CN=db.invalid -keyout server.key -out server.csr
          printf 'subjectAltName=DNS:db.invalid,DNS:localhost\n' > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 1 -out server.crt -extfile ext.cnf
          chmod 0644 server.crt server.key ca.pem
          docker run -d --name pgtls -p 5433:5432 \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=probe \
            -v "${dir}:/certs:ro" postgres:16.4 \
            bash -c 'cp /certs/server.crt /certs/server.key /var/lib/postgresql/ && chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key && chmod 0600 /var/lib/postgresql/server.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key'
          for _ in $(seq 1 30); do
            # Ready once the role for the verified-TLS read exists.
            if docker exec pgtls psql -U postgres -d probe -c "CREATE ROLE reader LOGIN" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs pgtls
          exit 1
      - name: Run live SQL tests against Postgres and MariaDB
        env:
          COMPRESSO_SQL_TEST_REQUIRE_LIVE: "1"
          # The tests create the unprivileged `reader` accounts themselves.
          COMPRESSO_SQL_TEST_POSTGRES_URL: postgres://reader@127.0.0.1:5432/probe?sslmode=disable
          COMPRESSO_SQL_TEST_POSTGRES_PRIVILEGED_URL: postgres://postgres@127.0.0.1:5432/probe?sslmode=disable
          COMPRESSO_SQL_TEST_MYSQL_URL: mysql://reader@127.0.0.1:3306/compresso_probe?ssl-mode=DISABLED
          COMPRESSO_SQL_TEST_MYSQL_PRIVILEGED_URL: mysql://root@127.0.0.1:3306/compresso_probe?ssl-mode=DISABLED
        shell: bash
        run: |
          # The tool refuses to run while SSL_CERT_FILE or SSL_CERT_DIR is set
          # (they would change which servers TLS trusts); the private CA of
          # the TLS check is passed through the URL's sslrootcert instead.
          # Report set-but-empty separately: an empty value is still "set".
          for name in SSL_CERT_FILE SSL_CERT_DIR; do
            if [ -z "${!name+x}" ]; then
              echo "${name}: not set"
            else
              value="${!name}"
              echo "${name}: set by the environment, value length ${#value}"
            fi
          done
          unset SSL_CERT_FILE SSL_CERT_DIR
          export COMPRESSO_SQL_TEST_POSTGRES_WRONG_HOST_URL="postgres://reader@127.0.0.1:5433/probe?sslmode=verify-full&sslrootcert=${RUNNER_TEMP}/pgtls/ca.pem"
          export COMPRESSO_SQL_TEST_POSTGRES_TLS_URL="postgres://reader@localhost:5433/probe?sslmode=verify-full&sslrootcert=${RUNNER_TEMP}/pgtls/ca.pem"
          cargo test -p compresso-sql --locked --test live -- --test-threads=1 --nocapture
      - name: Run live MySQL tests against MySQL 8.4
        # Runs even when the previous step failed, so one round reports
        # both engines; the job still fails if either step fails.
        if: ${{ !cancelled() }}
        env:
          COMPRESSO_SQL_TEST_REQUIRE_LIVE: "1"
          COMPRESSO_SQL_TEST_MYSQL_URL: mysql://reader@127.0.0.1:3307/compresso_probe?ssl-mode=DISABLED
          COMPRESSO_SQL_TEST_MYSQL_PRIVILEGED_URL: mysql://root@127.0.0.1:3307/compresso_probe?ssl-mode=DISABLED
        shell: bash
        run: |
          unset SSL_CERT_FILE SSL_CERT_DIR
          cargo test -p compresso-sql --locked --test live -- --test-threads=1 --nocapture live_mysql
      - name: Stop the TLS Postgres
        if: always()
        run: docker rm -f pgtls || true

  live-mongo:
    # E17-52: the compresso_mongo tests that need a real server, against
    # throwaway containers made in this job. The other jobs stay
    # server-free.
    name: Live MongoDB
    runs-on: ubuntu-24.04
    env:
      MONGO_IMAGE: mongo:8.0.38@sha256:479e85ced54ffb8a40dade1dcde2da2a9ae858515b9415e9cc54bfb8f0575d01
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          # Remove after https://github.com/Swatinem/rust-cache/issues/331 is fixed.
          NODE_OPTIONS: --disable-warning=DEP0040
        with:
          shared-key: ci-ubuntu-24.04
      - name: Start MongoDB with access control
        # The root password is made here and lives only in this job; the
        # tests use root only to create their accounts and data.
        shell: bash
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          docker run -d --name mongoauth -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=root -e MONGO_INITDB_ROOT_PASSWORD="${password}" \
            "${MONGO_IMAGE}"
          echo "COMPRESSO_MONGO_TEST_ADMIN_URL=mongodb://root:${password}@127.0.0.1:27017/?authSource=admin&directConnection=true" >> "${GITHUB_ENV}"
          for _ in $(seq 1 45); do
            if docker exec mongoauth mongosh --quiet -u root -p "${password}" --eval 'db.runCommand({ping: 1}).ok' 2>/dev/null | grep -q 1; then
              exit 0
            fi
            sleep 2
          done
          docker logs mongoauth
          exit 1
      - name: Start a TLS MongoDB with a throwaway certificate
        # Access control is off on purpose: the tool must refuse it. The
        # certificate names only localhost, so a client verifying 127.0.0.1
        # must refuse it.
        shell: bash
        run: |
          dir="${RUNNER_TEMP}/mongotls"
          mkdir -p "${dir}"
          cd "${dir}"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=compresso-test-ca -keyout ca.key -out ca.pem
          openssl req -newkey rsa:2048 -nodes -subj /CN=localhost -keyout server.key -out server.csr
          printf 'subjectAltName=DNS:localhost\n' > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 1 -out server.crt -extfile ext.cnf
          cat server.crt server.key > server.pem
          chmod 0644 server.pem ca.pem
          docker run -d --name mongotls -p 27018:27017 -v "${dir}:/certs:ro" "${MONGO_IMAGE}" \
            mongod --bind_ip_all --tlsMode requireTLS --tlsCertificateKeyFile /certs/server.pem \
            --tlsCAFile /certs/ca.pem --tlsAllowConnectionsWithoutCertificates
          for _ in $(seq 1 45); do
            if docker exec mongotls mongosh --quiet --tls --tlsCAFile /certs/ca.pem --host localhost --eval 'db.runCommand({ping: 1}).ok' 2>/dev/null | grep -q 1; then
              exit 0
            fi
            sleep 2
          done
          docker logs mongotls
          exit 1
      - name: Run live MongoDB tests
        env:
          COMPRESSO_SQL_TEST_REQUIRE_LIVE: "1"
          COMPRESSO_MONGO_TEST_HOST: 127.0.0.1:27017
          COMPRESSO_MONGO_TEST_TLS_HOST: localhost:27018
        shell: bash
        run: |
          docker exec mongoauth mongod --version
          export COMPRESSO_MONGO_TEST_TLS_CA="${RUNNER_TEMP}/mongotls/ca.pem"
          cargo test -p compresso-sql --locked --test live_mongo -- --test-threads=1 --nocapture
      - name: Stop the MongoDB containers
        if: always()
        run: docker rm -f mongoauth mongotls || true

  eval:
    name: Eval (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            enforce_latency: false
          - os: macos-15
            enforce_latency: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reuse Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          # Remove after https://github.com/Swatinem/rust-cache/issues/331 is fixed.
          NODE_OPTIONS: --disable-warning=DEP0040
        with:
          shared-key: ci-${{ matrix.os }}
      - name: Run release evaluation gates
        shell: bash
        env:
          ENFORCE_LATENCY: ${{ matrix.enforce_latency }}
          REPORT_PATH: eval-report-${{ matrix.os }}.json
        run: |
          set +e
          cargo run -p compresso-eval --release -- run fixtures/ --gates docs/plan/gates.toml --json > "${REPORT_PATH}"
          eval_status=$?
          set -e

          if ! jq -e '.gates.gates | type == "array"' "${REPORT_PATH}" >/dev/null; then
            echo "evaluation did not produce a valid gate report" >&2
            exit 1
          fi

          if [[ "${ENFORCE_LATENCY}" == "true" ]]; then
            exit "${eval_status}"
          fi

          failed_fixtures="$(jq -r '.gates.failed_fixtures | join(", ")' "${REPORT_PATH}")"
          if [[ -n "${failed_fixtures}" ]]; then
            echo "release fixtures failed: ${failed_fixtures}" >&2
            exit 1
          fi

          failed_non_latency="$(jq -r '[.gates.gates[] | select(.name != "p95_latency_ms" and .passed == false) | .name] | join(", ")' "${REPORT_PATH}")"
          if [[ -n "${failed_non_latency}" ]]; then
            echo "non-latency release gates failed: ${failed_non_latency}" >&2
            exit 1
          fi

          failed_gates="$(jq -r '[.gates.gates[] | select(.passed == false) | .name] | join(", ")' "${REPORT_PATH}")"
          if [[ "${eval_status}" -ne 0 && "${failed_gates}" != "p95_latency_ms" ]]; then
            echo "evaluation failed without a latency-only regression" >&2
            exit "${eval_status}"
          fi
          if [[ "${failed_gates}" == "p95_latency_ms" ]]; then
            echo "P95 latency is reported on Ubuntu and enforced on macos-15"
          fi
      - name: Run large-payload latency gates
        if: ${{ matrix.enforce_latency }}
        run: cargo bench -p compresso-eval --bench large_payload_latency -- --noplot
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compresso-eval-${{ matrix.os }}
          path: eval-report-${{ matrix.os }}.json
          if-no-files-found: error

  package:
    name: Package (${{ matrix.target }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            binary: compresso
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: compresso
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: compresso
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: compresso.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        env:
          # Remove after https://github.com/actions/download-artifact/issues/484 is fixed.
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: compresso-${{ matrix.os }}
          path: package-input
      - name: Build deterministic tarball
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          test -n "${version}"
          scripts/package-tarball.sh \
            "package-input/${BINARY_NAME}" \
            "${version}" \
            "${TARGET}" \
            dist
      - name: Upload release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compresso-package-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  checksums:
    name: Aggregate release checksums
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Keyless Sigstore signing of the checksum manifest (SEC-007).
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        env:
          # Remove after https://github.com/actions/download-artifact/issues/484 is fixed.
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          pattern: compresso-package-*
          path: dist
          merge-multiple: true
      - name: Generate and verify SHA256SUMS
        shell: bash
        run: |
          archive_count=0
          for archive in dist/*.tar.gz; do
            test -f "${archive}" || continue
            archive_count=$((archive_count + 1))
          done
          test "${archive_count}" -eq 4
          scripts/package-tarball.sh --checksums dist/SHA256SUMS dist/*.tar.gz
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksum manifest with GitHub OIDC identity
        run: |
          cosign sign-blob \
            --yes \
            --bundle dist/SHA256SUMS.sigstore.json \
            dist/SHA256SUMS
      - name: Verify the signature as the installer will
        shell: bash
        run: |
          set -euo pipefail
          # The identity and issuer are read from the installer, so a change to
          # either side that the other does not match fails here.
          identity="$(sed -n "s/^signer_identity='\(.*\)'$/\1/p" installers/install-local.sh)"
          issuer="$(sed -n "s/^signer_issuer='\(.*\)'$/\1/p" installers/install-local.sh)"
          test -n "${identity}"
          test -n "${issuer}"
          cosign verify-blob \
            --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            dist/SHA256SUMS
      - name: Upload checksum manifest and signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compresso-checksums
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
          if-no-files-found: error
