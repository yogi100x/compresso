[package]
name = "compresso-sql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# E17-52 (D117): the BSON types the MongoDB allow-list builds by hand.
bson = { version = "=3.1.0", default-features = false }
futures-util = { version = "0.3", default-features = false }
# E17-52 (D117): the official MongoDB driver, with rustls on the ring
# provider (the one sqlx already uses), no DNS resolver (so no
# mongodb+srv:// lookups), no compression, no OpenSSL, and no encryption.
mongodb = { version = "=3.10.2", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls"] }
percent-encoding = "2.3"
rusqlite = { workspace = true, features = ["hooks", "limits"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "=0.9.1", default-features = false, features = ["postgres", "mysql", "runtime-tokio", "tls-rustls-ring-native-roots"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time"] }
url = "2.5"

[features]
# Only for this crate's own tests: calls that skip the statement gate or the
# MongoDB allow-list.
test-hooks = []

[dev-dependencies]
compresso-sql = { path = ".", features = ["test-hooks"] }
tempfile.workspace = true
