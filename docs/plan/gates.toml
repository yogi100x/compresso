schema_version = 1

[reduction]
# D37 / build-doc §25.6: eligible safe-mode median reduction must be above 25%.
median_reduction_eligible_min = 0.25

[safety]
# D37 / build-doc §25.6: protected-node mutations have zero tolerance.
protected_mutations_max = 0
# D37 / build-doc §25.6: malformed tool/provider JSON has zero tolerance.
malformed_json_max = 0

[latency]
# D37 / build-doc §25.6: warm local compression P95 must stay below 200 ms.
p95_ms_max = 200

[recall]
# D40 / 06-fixtures.md §4.9: protected recall probes require 100% recall.
protected_min = 1.0
# D40 / 06-fixtures.md §4.9: all recall probes require at least 99% recall.
overall_min = 0.99

[retrieval]
# D84 / 06-fixtures.md §12: gated tasks of fixtures/retrieval/, known_gap tasks excluded.
# D85: measured 1.0 on 20 gold tasks, body-only tasks included; one fully missed task (0.95) fails.
mean_recall_min = 0.96
# D85: measured 0.3400 (D84: 0.2557 on 15 gold tasks, floor 0.22). The margin absorbs one extra
# evidence item per task; a common body word flooding the decoy task (0.2945) fails.
mean_precision_min = 0.30
# D84: a ready pack that lacks a gold file, or answers an absent concept, has zero tolerance.
false_ready_max = 0
# D84: measured 1 (role-permission is withheld although its gold file is present).
ready_mismatches_max = 1
