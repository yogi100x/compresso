# Body-only: the concept is written only inside a function body. No symbol
# name, signature, or path carries it; the planner's content scan finds it.
[[task]]
id = "graceful-shutdown"
task = "Where do we handle SIGTERM for a graceful shutdown?"
gold_files = ["engine/src/worker.rs"]
expect_ready = true

[[task]]
id = "upload-checksum"
task = "Where is the checksum of an upload verified before it is committed?"
gold_files = ["storage/blobs.py"]
expect_ready = true

[[task]]
id = "clock-skew"
task = "Where do we allow for clock skew across hosts?"
gold_files = ["engine/src/liveness.rs"]
expect_ready = true

[[task]]
id = "reconnect-jitter"
task = "Where is jitter used to spread reconnects?"
gold_files = ["storage/mirror.py"]
expect_ready = true

# Body-only with a decoy: `execute` is in no symbol name and in more bodies
# than a specific name query returns (every migration step). It is a common
# word, not evidence: it must add nothing, or this task's pack floods.
[[task]]
id = "vacuum-statement"
task = "Where do we execute the vacuum statement?"
gold_files = ["storage/maintenance.py"]
expect_ready = true

# Use site: `tenant suspended` names a status helper in another file. The enum
# variant, an operator report that reads it, and the function that raises it
# share one file; the report names more task words than the raise site, so a
# flat two-per-file share leaves the raise site out. The file alone is not the
# answer: the raising symbol is gold.
[[task]]
id = "tenant-suspended-raise"
task = "Where is the tenant suspended error raised?"
gold_files = ["engine/src/tenancy.rs"]
gold_symbols = ["engine/src/tenancy.rs::gate_submission"]
expect_ready = true

# Referenced constant: the limit lives in a file no task word names, behind a
# constant the top excerpt compares against.
[[task]]
id = "multipart-part-ceiling"
task = "How big can one multipart upload part be before it is refused?"
gold_files = ["storage/multipart.py", "storage/limits.py"]
expect_ready = true

# Verbatim names and numbers (D88): the task copies a literal or a type name
# from the code. The literal sits only in a body, and the type's raise site is
# a body that no task word names.
[[task]]
id = "status-literal"
task = "Which response sends status 423, and when?"
gold_files = ["engine/src/admission_status.rs"]
expect_ready = true

[[task]]
id = "two-digit-literal"
task = "Which setting falls back to 14 when it is not configured?"
gold_files = ["storage/settings.py"]
expect_ready = true

[[task]]
id = "named-error-raise"
task = "Where is TooManyAttemptsError thrown?"
gold_files = ["auth/src/errors.ts", "auth/src/rateLimiter.ts"]
expect_ready = true

# Several parts in one task (D95): one report, the whole catalog, and keeping
# the check cheap for large sources. The answer is a shared comparison helper
# and the two functions that call it, in a file whose constants and other
# report functions fill the two-per-file share first. Before D95 each pack was
# ready without the per-report check or the helper: words scattered over
# unrelated excerpts covered half the task. The code never says "cheap" or
# "large", so no pack covers the last clause and none may be ready; no
# `expect_ready` is declared, so a planner that one day covers it is not
# penalised, while `false_ready` still fails a ready pack missing a symbol.
[[task]]
id = "cache-staleness-prose"
task = "In this repository, explain how the report cache decides that a cached report, or the whole catalog, is out of date compared with its source on disk, and how it keeps that check cheap for large sources. Cite source files and function names."
gold_files = ["engine/src/report_cache.rs"]
gold_symbols = [
    "engine/src/report_cache.rs::catalog_stale",
    "engine/src/report_cache.rs::report_current",
    "engine/src/report_cache.rs::source_unchanged",
]

[[task]]
id = "cache-staleness-terse"
task = "staleness check: how the report cache decides a cached report or the catalog is stale versus disk; cheap check for large sources (length, mtime, digest)"
gold_files = ["engine/src/report_cache.rs"]
gold_symbols = [
    "engine/src/report_cache.rs::catalog_stale",
    "engine/src/report_cache.rs::report_current",
    "engine/src/report_cache.rs::source_unchanged",
]

[[task]]
id = "cache-staleness-paraphrase"
task = "How does the report cache tell that one cached report or the whole catalog no longer matches its source on disk, and how is that kept cheap for large sources?"
gold_files = ["engine/src/report_cache.rs"]
gold_symbols = [
    "engine/src/report_cache.rs::catalog_stale",
    "engine/src/report_cache.rs::report_current",
    "engine/src/report_cache.rs::source_unchanged",
]

