schema_version = 1
# Planner budget applied to every task, in openai_o200k tokens.
budget_tokens = 1600

[[task]]
id = "payload-too-large"
task = "Where do we reject a job whose payload is too large, and what error does the caller get back?"
gold_files = ["engine/src/payload.rs"]
expect_ready = true

[[task]]
id = "retry-backoff"
task = "How is the retry backoff delay worked out between failed attempts?"
gold_files = ["engine/src/retry.rs"]
expect_ready = true

[[task]]
id = "lease-expiry"
task = "What happens to a job when its worker's lease expires before the work is finished?"
gold_files = ["engine/src/lease.rs"]
expect_ready = true

[[task]]
id = "dead-letter"
task = "When does a failing job get moved to the dead letter queue?"
gold_files = ["engine/src/dead_letter.rs"]
expect_ready = true

[[task]]
id = "token-bucket-throttle"
task = "How does the token bucket decide that an enqueue request is throttled?"
gold_files = ["engine/src/rate_limit.rs"]
expect_ready = true

[[task]]
id = "scheduler-next-run"
task = "How does the scheduler work out when a recurring job should run next?"
gold_files = ["engine/src/scheduler.rs"]
expect_ready = true

[[task]]
id = "access-token-expiry"
task = "How do we verify an access token, and which error is raised for an expired token?"
gold_files = ["auth/src/tokens.ts", "auth/src/errors.ts"]

[[task]]
id = "password-check"
task = "Where is the password hashed and compared when someone logs in?"
gold_files = ["auth/src/passwordHash.ts"]

[[task]]
id = "login-attempt-limit"
task = "How do we limit repeated failed login attempts for one account?"
gold_files = ["auth/src/rateLimiter.ts"]
expect_ready = true

[[task]]
id = "role-permission"
task = "How do we check whether a role has permission to cancel a job?"
gold_files = ["auth/src/permissions.ts"]
expect_ready = true

[[task]]
id = "blob-retention-purge"
task = "Which code purges expired blobs under the retention policy?"
gold_files = ["storage/retention.py"]
expect_ready = true

[[task]]
id = "chunked-file-read"
task = "How does the storage layer read a large file in chunks without loading it all?"
gold_files = ["storage/file_reader.py"]
expect_ready = true

[[task]]
id = "cli-enqueue-payload"
task = "How does the CLI enqueue command read the payload file and submit the job to the server?"
gold_files = ["cli/src/commands/enqueue.ts"]

[[task]]
id = "cli-server-url"
task = "Where does the CLI decide which server URL to talk to?"
gold_files = ["cli/src/config.ts"]
expect_ready = true

[[task]]
id = "retention-tests"
task = "Which tests cover purging expired blobs?"
gold_files = ["storage/tests/test_retention.py"]

# Body-only: the concept is written only inside a function body. No symbol
# name, signature, or path carries it; the planner's content scan finds it.
[[task]]
id = "graceful-shutdown"
task = "Where do we handle SIGTERM for a graceful shutdown?"
gold_files = ["engine/src/worker.rs"]
expect_ready = true

[[task]]
id = "upload-checksum"
task = "Where is the checksum of an upload verified before it is committed?"
gold_files = ["storage/blobs.py"]
expect_ready = true

[[task]]
id = "clock-skew"
task = "Where do we allow for clock skew across hosts?"
gold_files = ["engine/src/liveness.rs"]
expect_ready = true

[[task]]
id = "reconnect-jitter"
task = "Where is jitter used to spread reconnects?"
gold_files = ["storage/mirror.py"]
expect_ready = true

# Body-only with a decoy: `execute` is in no symbol name and in more bodies
# than a specific name query returns (every migration step). It is a common
# word, not evidence: it must add nothing, or this task's pack floods.
[[task]]
id = "vacuum-statement"
task = "Where do we execute the vacuum statement?"
gold_files = ["storage/maintenance.py"]
expect_ready = true

# Use site: `tenant suspended` names a status helper in another file. The enum
# variant, an operator report that reads it, and the function that raises it
# share one file; the report names more task words than the raise site, so a
# flat two-per-file share leaves the raise site out. The file alone is not the
# answer: the raising symbol is gold.
[[task]]
id = "tenant-suspended-raise"
task = "Where is the tenant suspended error raised?"
gold_files = ["engine/src/tenancy.rs"]
gold_symbols = ["engine/src/tenancy.rs::gate_submission"]
expect_ready = true

# Referenced constant: the limit lives in a file no task word names, behind a
# constant the top excerpt compares against.
[[task]]
id = "multipart-part-ceiling"
task = "How big can one multipart upload part be before it is refused?"
gold_files = ["storage/multipart.py", "storage/limits.py"]
expect_ready = true

# Verbatim names and numbers (D88): the task copies a literal or a type name
# from the code. The literal sits only in a body, and the type's raise site is
# a body that no task word names.
[[task]]
id = "status-literal"
task = "Which response sends status 423, and when?"
gold_files = ["engine/src/admission_status.rs"]
expect_ready = true

[[task]]
id = "two-digit-literal"
task = "Which setting falls back to 14 when it is not configured?"
gold_files = ["storage/settings.py"]
expect_ready = true

[[task]]
id = "named-error-raise"
task = "Where is TooManyAttemptsError thrown?"
gold_files = ["auth/src/errors.ts", "auth/src/rateLimiter.ts"]
expect_ready = true

# Absent concepts: nothing in the corpus answers these, so a ready pack would
# be a false claim.
[[task]]
id = "absent-webhooks"
task = "How do we send webhook notifications when a job completes?"
gold_files = []
expect_ready = false

[[task]]
id = "absent-billing-schema"
task = "Where is the GraphQL schema for billing invoices defined?"
gold_files = []
expect_ready = false

[[task]]
id = "absent-autoscaler"
task = "How does the autoscaler add replicas across regions?"
gold_files = []
expect_ready = false
